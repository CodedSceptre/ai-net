<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" aria-hidden="true">
  <!-- Background circle -->
  <circle cx="100" cy="80" r="60" fill="var(--accent-surface, rgba(99,102,241,0.12))"/>
  <!-- Card shape -->
  <rect x="55" y="55" width="90" height="60" rx="8" fill="var(--surface-raised, #1a1f2e)" stroke="var(--border-primary, #2a3040)" stroke-width="1.5"/>
  <!-- Card stripe -->
  <rect x="55" y="68" width="90" height="12" fill="var(--surface-elevated, #1e293b)"/>
  <!-- Chip -->
  <rect x="68" y="88" width="18" height="14" rx="3" fill="var(--accent-surface, rgba(99,102,241,0.3))" stroke="var(--accent, #a78bfa)" stroke-width="1"/>
  <!-- Dots (card number) -->
  <circle cx="102" cy="95" r="3" fill="var(--border-strong, #475569)"/>
  <circle cx="113" cy="95" r="3" fill="var(--border-strong, #475569)"/>
  <circle cx="124" cy="95" r="3" fill="var(--border-strong, #475569)"/>
  <!-- XLM symbol overlay -->
  <text x="100" y="58" text-anchor="middle" font-size="10" fill="var(--accent-info, #38bdf8)" font-family="monospace">XLM</text>
  <!-- Empty state slash -->
  <line x1="68" y1="122" x2="132" y2="58" stroke="var(--status-danger, #f87171)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
