global:
  resolve_timeout: 5m

route:
  receiver: slack-p2-p3
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: pagerduty-p1
      matchers:
        - severity="P1"
      group_wait: 10s
      repeat_interval: 1h
    - receiver: slack-p2-p3
      matchers:
        - severity=~"P2|P3"

receivers:
  - name: pagerduty-p1
    pagerduty_configs:
      - routing_key_file: /run/secrets/pagerduty_integration_key
        severity: critical
        send_resolved: true
        description: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }}) on {{ .CommonLabels.service }}"
        details:
          service: "{{ .CommonLabels.service }}"
          grafana_dashboard: "https://grafana.example.com/d/ai-net-overview/ai-net-overview"

  - name: slack-p2-p3
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        send_resolved: true
        title: "[{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}"
        text: >-
          Service: {{ .CommonLabels.service }}
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          Dashboard: https://grafana.example.com/d/ai-net-overview/ai-net-overview
# ── Routing tree ──────────────────────────────────────────────────────────────
route:
  group_by: ["alertname"]
  group_wait: 5m
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-ops"

  routes:
    # critical severity → PagerDuty
    - matchers:
        - severity = "critical"
      receiver: "pagerduty"
      group_by: ["alertname"]
      group_wait: 5m
      repeat_interval: 4h

    # warning severity → Slack #ops
    - matchers:
        - severity = "warning"
      receiver: "slack-ops"
      group_by: ["alertname"]
      group_wait: 5m
      repeat_interval: 4h

# ── Inhibit rules ─────────────────────────────────────────────────────────────
# When AllAgentsOffline is firing, suppress TaskQueueDepthHigh — the queue
# backs up because agents are down, not because of an independent capacity issue.
inhibit_rules:
  - source_matchers:
      - alertname = "AllAgentsOffline"
    target_matchers:
      - alertname = "TaskQueueDepthHigh"
    equal: []

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  - name: "pagerduty"
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: "{{ .GroupLabels.severity }}"
        description: "{{ range .Alerts }}{{ .Annotations.summary }} {{ end }}"
        details:
          runbook: "{{ (index .Alerts 0).Annotations.runbook_url }}"

  - name: "slack-ops"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#incidents"
        send_resolved: true
        title: "[{{ .Status | toUpper }}{{ if eq .Status \"firing\" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
