apiVersion: 1

contactPoints:
  - orgId: 1
    name: pagerduty-p1
    receivers:
      - uid: pagerduty-p1
        type: pagerduty
        settings:
          integrationKey: ${PAGERDUTY_INTEGRATION_KEY}
          severity: critical
          details:
            service: "{{ .CommonLabels.service }}"
            alert: "{{ .CommonLabels.alertname }}"
            dashboard: "{{ .ExternalURL }}/d/ai-net-overview/ai-net-overview"
        disableResolveMessage: false

  - orgId: 1
    name: slack-p2-p3
    receivers:
      - uid: slack-p2-p3
        type: slack
        settings:
          recipient: "#alerts"
          url: ${SLACK_WEBHOOK_URL}
          title: "[{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}"
          text: >-
            Service: {{ .CommonLabels.service }}
            {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
            Dashboard: {{ .ExternalURL }}/d/ai-net-overview/ai-net-overview
        disableResolveMessage: false
