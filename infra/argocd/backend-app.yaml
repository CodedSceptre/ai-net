apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-net-backend
  namespace: argocd
  annotations:
    # Notifications are configured in infra/argocd/notifications-cm.yaml
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: deployments
spec:
  project: default

  source:
    repoURL: https://github.com/CodedSceptre/ai-net.git
    targetRevision: main
    path: infra/k8s/helm/charts/backend
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-net

  syncPolicy:
    automated:
      # Remove Kubernetes resources that have been deleted from git
      prune: true
      # Revert any manual cluster changes back to the git-desired state
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Health check: backend is healthy only when GET /health returns 200
  # for all pods. Unhealthy for 5 minutes triggers automatic rollback.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # allow HPA to manage replicas without sync noise
