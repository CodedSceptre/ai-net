name: Renovate

on:
  # Run on a schedule to trigger Renovate scans
  schedule:
    - cron: "0 2 * * 6" # Every Saturday at 02:00 UTC (weekend schedule)
  # Allow manual triggers for on-demand dependency scans
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - debug
          - info
          - warn
          - error
  # Trigger on pushes to renovate.json to validate config changes immediately
  push:
    branches:
      - main
    paths:
      - "renovate.json"
      - ".github/workflows/renovate.yml"

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Renovate
        uses: renovatebot/github-action@v40
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: false
