name: Agent Discovery Load Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging or dedicated load-test backend URL
        required: true
        type: string
      baseline_p99_ms:
        description: Warm-cache p99 baseline in milliseconds
        required: true
        default: "500"
        type: string

permissions:
  contents: read

jobs:
  agent-discovery:
    name: Agent discovery 1000 RPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Prepare report output
        run: mkdir -p tests/load/results

      - name: Run cold and warm cache scenarios
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: k6 run tests/load/scenarios/get-agents.js

      - name: Check warm-cache p99 regression
        if: always()
        env:
          BASELINE_P99_MS: ${{ inputs.baseline_p99_ms }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summaryPath = 'tests/load/results/get-agents-summary.json';
          if (!fs.existsSync(summaryPath)) {
            coreNotice('Load-test summary is missing; k6 may have failed before reporting.');
            process.exit(0);
          }

          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const baseline = Number(process.env.BASELINE_P99_MS);
          const actual = summary.warmCacheP99Ms;
          if (!Number.isFinite(baseline) || baseline <= 0 || !Number.isFinite(actual)) {
            console.error(`Invalid baseline or warm-cache p99: baseline=${baseline}, actual=${actual}`);
            process.exit(1);
          }

          const limit = baseline * 1.2;
          console.log(`Warm-cache p99: ${actual.toFixed(2)} ms; baseline: ${baseline} ms; regression limit: ${limit.toFixed(2)} ms`);
          if (actual > limit) process.exit(1);

          function coreNotice(message) {
            console.log(`::notice::${message}`);
          }
          NODE

      - name: Upload load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-discovery-load-test
          path: tests/load/results/
          if-no-files-found: warn
          retention-days: 30
