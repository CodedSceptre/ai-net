name: Security scan PR summary

on:
  workflow_run:
    workflows: [Security scans]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run.head_repository) return;
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main',
              head: run.head_repository.owner.login + ':' + run.head_branch
            });
            const pr = pulls.find(pull => pull.head.sha === run.head_sha &&
              pull.head.repo?.id === run.head_repository.id);
            if (!pr) return;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: run.id, attempt_number: run.run_attempt
            });
            const status = name => jobs.find(job => job.name === name)?.conclusion ?? 'unavailable';
            const marker = '<!-- ai-net-security-scan -->';
            const body = [
              marker,
              '### Security scans',
              '',
              '- TruffleHog — ' + status('TruffleHog'),
              '- npm audit — backend: ' + status('npm backend') + ', frontend: ' + status('npm frontend'),
              '- Cargo audit — ' + status('Cargo audit'),
              '',
              '[Workflow run](' + run.html_url + ')'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number
            });
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }
