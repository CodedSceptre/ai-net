name: Database Backup

on:
  schedule:
    # 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup SQLite databases to S3
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Run backup via ECS execute-command
        id: backup
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service-name "${{ secrets.ECS_SERVICE }}" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "No running ECS task found" >&2
            exit 1
          fi

          echo "Running backup on task: $TASK_ARN"
          aws ecs execute-command \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --task "$TASK_ARN" \
            --container backend \
            --command "/app/scripts/backup-db.sh" \
            --interactive

      - name: Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":white_check_mark: *ai-net DB backup succeeded*\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nDate: ${{ github.run_started_at }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":x: *ai-net DB backup FAILED*\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
