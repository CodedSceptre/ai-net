name: Staging Deployment

# Triggers:
#  1. Automatically on every successful CI run on main (workflow_run).
#  2. Manually via workflow_dispatch for ad-hoc deploys or rollbacks.
#
# The workflow_run trigger fires only when `CI` finishes with a conclusion of
# `success` on the `main` branch, so only verified commits reach staging.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual staging deployment"

# Only one staging deployment at a time — cancel the in-progress run if a
# newer commit races past it. The `staging` concurrency group is shared across
# both trigger paths so a manual dispatch also cancels a running auto-deploy.
concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push images to GHCR
  issues: write     # open failure issue automatically

# Gate automatic deploys on CI success. A manual dispatch always proceeds
# regardless of prior CI outcome (the operator is taking responsibility).
jobs:
  check-trigger:
    name: Check trigger conditions
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "CI did not succeed (conclusion=${{ github.event.workflow_run.conclusion }}). Skipping staging deploy."
          fi

  deploy:
    name: Build, push, deploy, smoke-test
    needs: check-trigger
    if: needs.check-trigger.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # All staging secrets live in the `staging` environment so they are
    # isolated from repo-level secrets and can be rotated independently.
    environment: staging
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name || 'ai-net' }}
      # Use the SHA from the triggering workflow_run, or the current SHA for
      # manual dispatches.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # ── Docker / GHCR setup ─────────────────────────────────────────────────
      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & push frontend image ─────────────────────────────────────────
      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}/frontend:sha-${{ env.DEPLOY_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}/frontend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & push backend image ──────────────────────────────────────────
      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}/backend:sha-${{ env.DEPLOY_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}/backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Smart contract deployment to Stellar testnet ────────────────────────
      - name: Set up Node.js (for deploy scripts)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json

      - name: Install smart-contract dependencies
        working-directory: smart-contracts
        run: npm ci

      - name: Deploy smart contracts to Stellar testnet
        id: deploy-contracts
        if: ${{ vars.STELLAR_DEPLOY_ENABLED == 'true' }}
        working-directory: smart-contracts
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOY_SECRET }}
          STELLAR_NETWORK: testnet
        run: |
          ./scripts/deploy.sh --network testnet 2>&1 | tee /tmp/deploy-contracts.log
          echo "deploy-log<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/deploy-contracts.log >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        continue-on-error: true   # contract deploy failure must not block app deploy

      # ── Deploy containers to staging environment ────────────────────────────
      - name: Deploy containers to staging
        id: deploy-containers
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}/frontend:sha-${{ env.DEPLOY_SHA }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_NAME }}/backend:sha-${{ env.DEPLOY_SHA }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          # When STAGING_HOST is not set (e.g. this is a fork / first-time setup),
          # skip the remote deploy and simulate locally with docker compose.
          if [[ -z "${STAGING_HOST}" ]]; then
            echo "::notice::STAGING_HOST not set — skipping remote deploy. Running docker compose locally as a dry-run."
            FRONTEND_IMAGE=${FRONTEND_IMAGE} BACKEND_IMAGE=${BACKEND_IMAGE} \
              docker compose pull --quiet frontend backend 2>/dev/null || true
            echo "container-deploy=skipped" >> "$GITHUB_OUTPUT"
          else
            # Write SSH key to a temp file with restricted permissions.
            SSH_KEY_FILE=$(mktemp)
            echo "${STAGING_SSH_KEY}" > "${SSH_KEY_FILE}"
            chmod 600 "${SSH_KEY_FILE}"

            # Copy docker-compose override and pull + restart containers on staging.
            ssh -i "${SSH_KEY_FILE}" -o StrictHostKeyChecking=no \
              "deploy@${STAGING_HOST}" \
              "FRONTEND_IMAGE=${FRONTEND_IMAGE} BACKEND_IMAGE=${BACKEND_IMAGE} \
               docker compose -f /opt/ai-net/docker-compose.yml \
                              -f /opt/ai-net/docker-compose.staging.yml \
                              pull && \
               docker compose -f /opt/ai-net/docker-compose.yml \
                              -f /opt/ai-net/docker-compose.staging.yml \
                              up -d --remove-orphans"

            rm -f "${SSH_KEY_FILE}"
            echo "container-deploy=success" >> "$GITHUB_OUTPUT"
          fi

      # ── Smoke tests ─────────────────────────────────────────────────────────
      - name: Wait for services to become ready
        run: sleep 15

      - name: Smoke test — backend health
        id: smoke-health
        env:
          STAGING_URL: ${{ vars.STAGING_BACKEND_URL || 'http://localhost:3000' }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "${STAGING_URL}/health" --max-time 10)
          echo "health-status=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          cat /tmp/health.json || true
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "::error::GET /health returned ${HTTP_CODE}"
            exit 1
          fi
          echo "::notice::GET /health → 200 OK"

      - name: Smoke test — agents endpoint returns valid JSON
        id: smoke-agents
        env:
          STAGING_URL: ${{ vars.STAGING_BACKEND_URL || 'http://localhost:3000' }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/agents.json -w "%{http_code}" "${STAGING_URL}/api/agents" --max-time 10)
          echo "agents-status=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          # Validate JSON structure (must be an array or object).
          if ! python3 -c "import json, sys; data=json.load(open('/tmp/agents.json')); sys.exit(0 if isinstance(data, (list, dict)) else 1)" 2>/dev/null; then
            echo "::error::GET /api/agents did not return valid JSON"
            cat /tmp/agents.json || true
            exit 1
          fi
          echo "::notice::GET /api/agents → ${HTTP_CODE}, valid JSON"

      # ── Deployment summary ──────────────────────────────────────────────────
      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## ✅ Staging deployment succeeded"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ env.DEPLOY_SHA }}\` |"
            echo "| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Frontend image | \`${{ steps.build-frontend.outputs.imageid }}\` |"
            echo "| Backend image | \`${{ steps.build-backend.outputs.imageid }}\` |"
            echo "| Contract deploy | ${{ steps.deploy-contracts.outcome }} |"
            echo "| Container deploy | ${{ steps.deploy-containers.outputs.container-deploy }} |"
            echo "| Staging URL | ${{ vars.STAGING_FRONTEND_URL || 'http://localhost:5173' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Auto-open failure issue ─────────────────────────────────────────────
      - name: Open failure issue on smoke-test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAIL_BODY="## Staging deployment failed

          **Commit:** \`${{ env.DEPLOY_SHA }}\`
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Triggered by:** \`${{ github.event_name }}\`

          ### Smoke test results

          - GET /health: \`${{ steps.smoke-health.outputs.health-status }}\`
          - GET /api/agents: \`${{ steps.smoke-agents.outputs.agents-status }}\`

          ### Contract deploy log

          \`\`\`
          ${{ steps.deploy-contracts.outputs.deploy-log }}
          \`\`\`

          Investigate the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full logs."

          gh issue create \
            --title "🚨 Staging deployment failed — ${{ env.DEPLOY_SHA }}" \
            --body "${FAIL_BODY}" \
            --label "devops,staging" \
            --repo "${{ github.repository }}" \
          || echo "::warning::Could not create failure issue (label may not exist). Check workflow run for details."
