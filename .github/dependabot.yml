version: 2

updates:
  # ── Root npm workspace ────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "chore"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      stellar-root:
        patterns:
          - "@stellar/*"
      testing-root:
        patterns:
          - "jest*"
          - "ts-jest*"
          - "@types/jest*"
    ignore:
      # Major version bumps require manual review — too risky to auto-merge
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "CodedSceptre/maintainers"
    open-pull-requests-limit: 10

  # ── Frontend npm ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "frontend"
      - "chore"
    commit-message:
      prefix: "chore(frontend)"
      prefix-development: "chore(frontend)"
      include: "scope"
    groups:
      stellar-frontend:
        patterns:
          - "@stellar/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
          - "@types/react*"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
      testing-frontend:
        patterns:
          - "@testing-library/*"
          - "msw"
          - "playwright"
          - "@playwright/*"
      i18n:
        patterns:
          - "i18next*"
          - "react-i18next*"
      ui-components:
        patterns:
          - "lucide-react"
          - "framer-motion"
          - "recharts"
          - "reactflow"
          - "react-markdown*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "CodedSceptre/maintainers"
    open-pull-requests-limit: 15

  # ── Backend npm ──────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "backend"
      - "chore"
    commit-message:
      prefix: "chore(backend)"
      prefix-development: "chore(backend)"
      include: "scope"
    groups:
      stellar-backend:
        patterns:
          - "@stellar/*"
      express-middleware:
        patterns:
          - "express*"
          - "cors"
          - "compression"
          - "swagger-*"
      testing-backend:
        patterns:
          - "jest*"
          - "ts-jest*"
          - "supertest*"
          - "@types/jest*"
          - "@types/supertest*"
      database:
        patterns:
          - "better-sqlite3*"
          - "@types/better-sqlite3*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "CodedSceptre/maintainers"
    open-pull-requests-limit: 15

  # ── Smart contracts npm ──────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/smart-contracts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "smart-contract"
      - "chore"
    commit-message:
      prefix: "chore(contracts)"
      prefix-development: "chore(contracts)"
      include: "scope"
    groups:
      stellar-contracts:
        patterns:
          - "@stellar/*"
      testing-contracts:
        patterns:
          - "jest*"
          - "ts-jest*"
          - "@types/jest*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "CodedSceptre/maintainers"
    open-pull-requests-limit: 10

  # ── Cargo (Rust / Soroban smart contracts) ────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/smart-contracts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "smart-contract"
      - "chore"
    commit-message:
      prefix: "chore(contracts)"
      prefix-development: "chore(contracts)"
      include: "scope"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-sdk*"
          - "stellar-*"
      serde:
        patterns:
          - "serde*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "CodedSceptre/maintainers"
    open-pull-requests-limit: 10

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "ci"
      - "chore"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-all:
        patterns:
          - "*"
    reviewers:
      - "CodedSceptre/maintainers"
    open-pull-requests-limit: 5
